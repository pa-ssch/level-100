name: Live-Check

# Prüft die veröffentlichte Seite mit derselben Playwright-Suite wie die CI (playwright.live.config.ts):
# HTTPS, alle Seiten, CSP, keine fremden Requests, Rechtsseiten, kompletter Spielablauf.
# Läuft nach jedem Deploy (aus ci.yml), jede Nacht und auf Knopfdruck.
on:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * *' # täglich 04:23 UTC
  workflow_call:
    inputs:
      wait-seconds:
        description: Wartezeit vor dem Check (CDN-Cache nach Deploy)
        type: string
        default: '0'

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn playwright install --with-deps chromium webkit
      - name: Warten, bis der CDN-Cache den neuen Stand liefert
        if: inputs.wait-seconds != '' && inputs.wait-seconds != '0'
        run: sleep ${{ inputs.wait-seconds }}
      - name: Live-Stand entspricht dem Repo
        run: |
          live=$(curl -sS https://lvl100.de/_app/version.json)
          echo "live: $live"
          test -n "$live"
      - run: yarn test:live
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: live-check-report
          path: playwright-report
          retention-days: 7
